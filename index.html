<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon des Refusés 2026</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f8f8f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .gallery a {
            display: block;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .lightbox:target {
            display: flex;
        }

        /* Exit button */
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>

<body>

<h1>Salon des Refusés 2026</h1>

<div class="gallery">

    <a href="#image1">
        <img src="HOLDING_REDLICH_EVENT_107.jpg" alt="Salon des Refusés 2026">
    </a>

    <a href="#image2">
        <img src="HOLDING_REDLICH_EVENT_113.jpg" alt="Salon des Refusés 2026">
    </a>

    <a href="#image3">
        <img src="HOLDING_REDLICH_EVENT_114.jpg" alt="Salon des Refusés 2026">
    </a>

</div>


<!-- Enlarged images -->

<div id="image1" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="HOLDING_REDLICH_EVENT_107.jpg" alt="Salon des Refusés 2026">
</div>

<div id="image2" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="HOLDING_REDLICH_EVENT_113.jpg" alt="Salon des Refusés 2026">
</div>

<div id="image3" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="HOLDING_REDLICH_EVENT_114.jpg" alt="Salon des Refusés 2026">
</div>


</body>
</html>
