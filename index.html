<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon des Refusés 2026</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f8f8f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .gallery a {
            display: block;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        /* Show image */
        .lightbox:target {
            display: flex;
        }

        /* Close button */
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1>Salon des Refusés 2026</h1>

    <!-- Gallery Grid -->
    <div class="gallery">

        <a href="#img1">
            <img src="HOLDING_REDLICH_EVENT_107.jpg" alt="Salon des Refusés 2026">
        </a>

        <a href="#img2">
            <img src="HOLDING_REDLICH_EVENT_113.jpg" alt="Salon des Refusés 2026">
        </a>

        <a href="#img3">
            <img src="HOLDING_REDLICH_EVENT_114.jpg" alt="Salon des Refusés 2026">
        </a>

    </div>


    <!-- Full size images -->

    <div id="img1" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="HOLDING_REDLICH_EVENT_107.jpg" alt="Salon des Refusés 2026">
    </div>


    <div id="img2" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="HOLDING_REDLICH_EVENT_113.jpg" alt="Salon des Refusés 2026">
    </div>


    <div id="img3" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="HOLDING_REDLICH_EVENT_114.jpg" alt="Salon des Refusés 2026">
    </div>


</body>
</html>
